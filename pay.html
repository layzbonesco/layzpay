<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Account Details</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f2;display:flex;
    justify-content:center;align-items:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box;color:#111}
  .card{background:#fff;border-radius:14px;padding:32px 28px;max-width:380px;width:100%;text-align:center;
    box-shadow:0 2px 16px rgba(0,0,0,.08)}
  h1{font-size:20px;font-weight:700;margin:0 0 4px;overflow-wrap:anywhere}
  h2{font-size:13px;color:#888;font-weight:500;margin:0 0 24px;text-transform:uppercase;letter-spacing:.5px}
  .field{margin-bottom:18px;text-align:left}
  .label{font-size:12px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .value-row{display:flex;align-items:center;gap:8px;background:#f7f7f5;border-radius:10px;padding:12px 14px}
  .value{font-size:17px;font-weight:700;flex:1;word-break:break-all}
  .copy-btn{background:#1a1a1a;color:#fff;border:none;border-radius:7px;padding:8px 12px;font-size:12px;
    font-weight:600;cursor:pointer;flex-shrink:0}
  .copy-btn:active{background:#333}
  .copy-btn.copied{background:#16a34a}
  .note{font-size:12px;color:#999;margin-top:20px;line-height:1.5;overflow-wrap:anywhere}
  .note.small{margin-top:8px}
</style>
</head>
<body>
<div class="card" id="app" aria-live="polite"></div>
<script>
(function(){
  var app=document.getElementById('app');
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
  function copy(text,btn){
    function ok(){btn.textContent='Copied!';btn.classList.add('copied');
      setTimeout(function(){btn.textContent='Copy';btn.classList.remove('copied');},1500);}
    function fallback(){
      var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
      ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');ok();}catch(e){btn.textContent='Long-press to copy';}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fallback);}
    else{fallback();}
  }
  function field(label,value){
    var f=el('div','field');
    f.appendChild(el('div','label',label));
    var row=el('div','value-row');
    row.appendChild(el('div','value',value));
    var b=el('button','copy-btn','Copy');b.type='button';
    b.addEventListener('click',function(){copy(value,b);});
    row.appendChild(b);f.appendChild(row);return f;
  }
  function render(){
    var p=new URLSearchParams(location.hash.replace(/^#/,''));
    var t=(p.get('t')||'').slice(0,80), n=(p.get('n')||'').slice(0,80), a=(p.get('a')||'').slice(0,40),
        r=(p.get('r')||'').slice(0,60), m=(p.get('m')||'').slice(0,200);
    app.textContent='';
    if(!n||!a){
      app.appendChild(el('h1',null,'No payment details in this link'));
      app.appendChild(el('p','note','Ask the seller for their QR code again.'));
      return;
    }
    document.title=(t||n)+' - Account Details';
    if(t)app.appendChild(el('h1',null,t));
    app.appendChild(el('h2',null,'Account Details'));
    app.appendChild(field('Account Name',n));
    app.appendChild(field('Account Number',a));
    if(r)app.appendChild(field('Reference',r));
    var note=m||('Pay by bank transfer using the account name and number above'+(r?', with “'+r+'” as the reference.':'.'));
    app.appendChild(el('p','note',note));
    app.appendChild(el('p','note small','Check the account name matches who you mean to pay.'));
  }
  window.addEventListener('hashchange',render);
  render();
})();
</script>
</body>
</html>
